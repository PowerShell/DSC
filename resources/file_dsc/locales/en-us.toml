_version = 1

[main]
missingOperation = "Missing operation. Usage: file_dsc <get|set|test> --input <json> | file_dsc acl <get|set|test> --input <json>"
unknownOperation = "Unknown operation: '%{operation}'. Expected: get, set, or test"
missingInput = "Missing --input argument"
missingInputValue = "Missing value for --input argument"
invalidJson = "Invalid JSON input: %{error}"
serializeError = "Failed to serialize output: %{error}"

[input]
emptyPath = "The path must not be empty"
invalidHash = "%{name} must contain exactly %{length} hexadecimal characters"

[get]
readError = "Failed to read file '%{path}': %{error}"

[set]
contentRequired = "The content property is required when setting a file"
creatingParentDirectory = "Creating parent directory '%{path}'"
createParentDirectoryError = "Failed to create parent directory '%{path}': %{error}"
writeError = "Failed to write file '%{path}': %{error}"
removeError = "Failed to remove file '%{path}': %{error}"
sha256Mismatch = "The sha256 value does not match the content property"
sha512Mismatch = "The sha512 value does not match the content property"

[acl]
missingOperation = "Missing ACL operation. Usage: file_dsc acl <get|set|test> --input <json>"
unknownOperation = "Unknown ACL operation: '%{operation}'. Expected: get, set, or test"
windowsOnly = "The filesystem ACL resource is only supported on Windows"
emptySddl = "The SDDL property must not be empty"
unsupportedSddlComponent = "The SDDL property must contain only a discretionary ACL (D:) component"
pathNotFound = "The path '%{path}' does not exist"
pathCheckError = "Failed to inspect the path '%{path}': %{error}"
invalidSddl = "The SDDL property is invalid: %{error}"
getError = "Failed to read the ACL for '%{path}': %{error}"
setError = "Failed to set the ACL for '%{path}': %{error}"
convertError = "Failed to convert the security descriptor to SDDL: %{error}"
emptyDescriptor = "The security descriptor was empty"
