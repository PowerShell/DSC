_version = 1

[main]
about = "Manage OCI registry discovery settings and serve the DSC Discover JSON-RPC extension"
input = "RegistryList JSON input"
failed = "OCI registry operation failed: %{error}"
invalidInput = "Invalid RegistryList input: %{error}"
exportName = "OCI Registries"

[settings]
invalid = "Each registry must have one nonempty, unique friendly name other than 'local', a valid location, and valid optional secret references"
