$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
parameters:
  myString:
    type: secureString
  myObject:
    type: secureObject
  showSecrets:
    type: bool
    defaultValue: false
resources:
  - name: SecureString
    type: Microsoft.DSC.Debug/Echo
    properties:
      output: "[parameters('myString')]"
      showSecrets: "[parameters('showSecrets')]"
  - name: SecureObject
    type: Microsoft.DSC.Debug/Echo
    properties:
      output: "[parameters('myObject')]"
      showSecrets: "[parameters('showSecrets')]"
  - name: SecureProperty
    type: Microsoft.DSC.Debug/Echo
    properties:
      output: "[parameters('myObject').secureObject.myProperty]"
      showSecrets: "[parameters('showSecrets')]"
  - name: SecureArray
    type: Microsoft.DSC.Debug/Echo
    properties:
      output: "[parameters('myObject').secureObject.myArray]"
      showSecrets: "[parameters('showSecrets')]"
  - name: SecureArrayIndexed
    type: Microsoft.DSC.Debug/Echo
    properties:
      output: "[parameters('myObject').secureObject.myArray[1]]"
      showSecrets: "[parameters('showSecrets')]"
