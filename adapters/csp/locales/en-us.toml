notBridgeClass = "Class '%{name}' is not a device/current-user MDM Bridge class."
unsupportedType = "Unsupported CIM type %{cimType} on property '%{name}'."
emptyArray = "Property '%{name}' is an empty array. The wmi crate cannot write an empty array without converting it to null; this value is not supported."
systemRequired = "Class '%{name}' requires LocalSystem (S-1-5-18). An elevated administrator is not sufficient. Run DSC as LocalSystem for device-scoped CSPs."
userRequired = "Class '%{name}' requires the target user's own identity. Run DSC in that user's context, not as LocalSystem. Cross-user SID targeting is not supported."
